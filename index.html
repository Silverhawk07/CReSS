 PHT"}, {"url": "overlay_ps_24h_day04.geojson", "title": "Daily Mean Surface Pressure Isobars (hPa) | Day 4 | Valid: 25 Sep 09:00 AM \u2013 26 Sep 2026 08:00 AM PHT"}, {"url": "overlay_ps_24h_day05.geojson", "title": "Daily Mean Surface Pressure Isobars (hPa) | Day 5 | Valid: 26 Sep 09:00 AM \u2013 27 Sep 2026 08:00 AM PHT"}, {"url": "overlay_ps_24h_day06.geojson", "title": "Daily Mean Surface Pressure Isobars (hPa) | Day 6 | Valid: 27 Sep 09:00 AM \u2013 28 Sep 2026 08:00 AM PHT"}, {"url": "overlay_ps_24h_day07.geojson", "title": "Daily Mean Surface Pressure Isobars (hPa) | Day 7 | Valid: 28 Sep 09:00 AM \u2013 29 Sep 2026 08:00 AM PHT"}, {"url": "overlay_ps_24h_day08.geojson", "title": "Daily Mean Surface Pressure Isobars (hPa) | Day 8 | Valid: 29 Sep 09:00 AM \u2013 30 Sep 2026 08:00 AM PHT"}, {"url": "overlay_ps_24h_day09.geojson", "title": "Daily Mean Surface Pressure Isobars (hPa) | Day 9 | Valid: 30 Sep 09:00 AM \u2013 01 Oct 2026 08:00 AM PHT"}, {"url": "overlay_ps_24h_day10.geojson", "title": "Daily Mean Surface Pressure Isobars (hPa) | Day 10 | Valid: 01 Oct 09:00 AM \u2013 02 Oct 2026 08:00 AM PHT"}]}};
                var METEOGRAM_DATA = {};
                var mapObj = mapInstance;

                mapObj.invalidateSize();
                var title = document.getElementById("slider-title");
                var slider = document.getElementById("time-slider");
                var playBtn = document.getElementById("play-btn");
                var opacitySlider = document.getElementById("opacity-slider");
                var varSelect = document.getElementById("var-select");
                var accumSelect = document.getElementById("accum-mode-select");
                var legendContainer = document.getElementById("legend-container");

                var currentOpacity = parseFloat(opacitySlider.value) / 100.0;
                var currentVar = "pra";
                var accumMode = "hourly";
                var activeFrames = varsData[currentVar][accumMode];

                var isPlaying = false;
                var timerId = null;
                var chartInstance = null;
                var geoJsonCache = {};

                var geoJsonLayer = L.geoJson(null, {
                    style: function(feature) {
                        return {
                            fillColor: feature.properties.fillColor || '#38bdf8',
                            fillOpacity: (feature.properties.fillOpacity !== undefined ? feature.properties.fillOpacity : 0.7) * currentOpacity,
                            color: feature.properties.color || '#38bdf8',
                            weight: feature.properties.weight || 1.5,
                            opacity: (feature.properties.opacity !== undefined ? feature.properties.opacity : 1.0) * currentOpacity
                        };
                    }
                }).addTo(mapObj);

                function getLegendHtml() {
                    if (currentVar === "pra") {
                        if (accumMode === "hourly") {
                            return `<div style="font-weight:700; color:#38bdf8; text-align:center; margin-bottom:6px;">Hourly Accumulated Rain (mm)</div>
                                    <div style="display:flex; flex-direction:column; gap:3px;">
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#FF0000; margin-right:6px;"></span>&gt; 30.0 (Extreme)</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#FFA500; margin-right:6px;"></span>15.01 - 30.0</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#FFFF00; margin-right:6px;"></span>10.01 - 15.0</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#00FF00; margin-right:6px;"></span>5.01 - 10.0</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#0000FF; margin-right:6px;"></span>2.51 - 5.0</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#8A2BE2; margin-right:6px;"></span>0.01 - 2.5</div>
                                    </div>`;
                        } else {
                            return `<div style="font-weight:700; color:#38bdf8; text-align:center; margin-bottom:6px;">24h Accumulated Rain (mm)</div>
                                    <div style="display:flex; flex-direction:column; gap:3px;">
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#FF0000; margin-right:6px;"></span>&gt; 200.0 (Extreme)</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#FFA500; margin-right:6px;"></span>100.01 - 200.0</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#FFFF00; margin-right:6px;"></span>50.01 - 100.0</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#00FF00; margin-right:6px;"></span>25.01 - 50.0</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#0000FF; margin-right:6px;"></span>10.01 - 25.0</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#4B0082; margin-right:6px;"></span>5.01 - 10.0</div>
                                        <div><span style="display:inline-block; width:14px; height:10px; background:#8B00FF; margin-right:6px;"></span>0.01 - 5.0</div>
                                    </div>`;
                        }
                    } else if (currentVar === "vort") {
                        return `<div style="font-weight:700; color:#38bdf8; text-align:center; margin-bottom:6px;">10m Vorticity (10⁻⁵ s⁻¹)</div>
                                <div style="display:flex; flex-direction:column; gap:3px;">
                                    <div><span style="display:inline-block; width:14px; height:10px; background:#FF0000; margin-right:6px;"></span>&gt; +20 (Cyclonic)</div>
                                    <div><span style="display:inline-block; width:14px; height:10px; background:#FFA500; margin-right:6px;"></span>+10 to +20</div>
                                    <div><span style="display:inline-block; width:14px; height:10px; background:#32CD32; margin-right:6px;"></span>-2 to +2 (Neutral)</div>
                                    <div><span style="display:inline-block; width:14px; height:10px; background:#0000FF; margin-right:6px;"></span>&lt; -10 (Anticyclonic)</div>
                                </div>`;
                    } else if (currentVar === "ps") {
                        return `<div style="font-weight:700; color:#38bdf8; text-align:center; margin-bottom:6px;">1.5m Surface Pressure Isobars (hPa)</div>
                                <div style="display:flex; flex-direction:column; gap:3px;">
                                    <div><span style="display:inline-block; width:16px; height:2px; background:#800080; margin-right:6px; vertical-align:middle;"></span>&lt; 980 hPa</div>
                                    <div><span style="display:inline-block; width:16px; height:2px; background:#4B0082; margin-right:6px; vertical-align:middle;"></span>980 - 995 hPa</div>
                                    <div><span style="display:inline-block; width:16px; height:2px; background:#0000FF; margin-right:6px; vertical-align:middle;"></span>995 - 1005 hPa</div>
                                    <div><span style="display:inline-block; width:16px; height:2px; background:#00FF00; margin-right:6px; vertical-align:middle;"></span>1005 - 1012 hPa</div>
                                    <div><span style="display:inline-block; width:16px; height:2px; background:#FFA500; margin-right:6px; vertical-align:middle;"></span>1012 - 1020 hPa</div>
                                    <div><span style="display:inline-block; width:16px; height:2px; background:#FF0000; margin-right:6px; vertical-align:middle;"></span>&gt; 1020 hPa</div>
                                </div>`;
                    }
                }

                legendContainer.innerHTML = getLegendHtml();

                function updateFrame(index) {
                    if (!activeFrames || activeFrames.length === 0) return;
                    if (index >= activeFrames.length) index = activeFrames.length - 1;
                    var frame = activeFrames[index];
                    if (!frame) return;

                    var url = frame.url;
                    if (geoJsonCache[url]) {
                        geoJsonLayer.clearLayers();
                        geoJsonLayer.addData(geoJsonCache[url]);
                    } else {
                        fetch(url)
                            .then(response => {
                                if (!response.ok) throw new Error("HTTP error " + response.status);
                                return response.json();
                            })
                            .then(data => {
                                geoJsonCache[url] = data;
                                geoJsonLayer.clearLayers();
                                geoJsonLayer.addData(data);
                            })
                            .catch(err => console.warn("GeoJSON overlay step unavailable:", url));
                    }

                    title.innerText = frame.title;
                    slider.value = index;
                }

                updateFrame(0);

                slider.addEventListener('input', function() {
                    updateFrame(parseInt(this.value));
                });

                playBtn.addEventListener('click', function() {
                    if (isPlaying) {
                        clearInterval(timerId);
                        isPlaying = false;
                        playBtn.innerText = "▶ Play";
                        playBtn.style.background = "#16a34a";
                    } else {
                        isPlaying = true;
                        playBtn.innerText = "⏸ Pause";
                        playBtn.style.background = "#dc2626";
                        timerId = setInterval(function() {
                            var curr = parseInt(slider.value);
                            var next = (curr + 1) % activeFrames.length;
                            updateFrame(next);
                        }, 600);
                    }
                });

                varSelect.addEventListener('change', function() {
                    currentVar = this.value;
                    activeFrames = varsData[currentVar][accumMode];
                    slider.max = activeFrames.length - 1;
                    legendContainer.innerHTML = getLegendHtml();
                    updateFrame(0);
                });

                accumSelect.addEventListener('change', function() {
                    accumMode = this.value;
                    activeFrames = varsData[currentVar][accumMode];
                    slider.max = activeFrames.length - 1;
                    legendContainer.innerHTML = getLegendHtml();
                    updateFrame(0);
                });

                opacitySlider.addEventListener('input', function() {
                    currentOpacity = parseFloat(this.value) / 100.0;
                    geoJsonLayer.setStyle({
                        fillOpacity: 0.7 * currentOpacity,
                        opacity: 1.0 * currentOpacity
                    });
                });

                // --- STANDALONE METEOGRAM LOOKUP ---
                function getNearestGridKey(lat, lng) {
                    var minDist = Infinity;
                    var nearestKey = null;
                    for (var key in METEOGRAM_DATA) {
                        var parts = key.split('_');
                        var pLat = parseFloat(parts[0]);
                        var pLng = parseFloat(parts[1]);
                        var dist = Math.pow(lat - pLat, 2) + Math.pow(lng - pLng, 2);
                        if (dist < minDist) {
                            minDist = dist;
                            nearestKey = key;
                        }
                    }
                    return nearestKey;
                }

                mapObj.on('click', function(e) {
                    var lat = e.latlng.lat.toFixed(3);
                    var lng = e.latlng.lng.toFixed(3);
                    renderMeteogramChart(lat, lng);
                });

                function renderMeteogramChart(lat, lng) {
                    if (!lat || !lng) return;

                    var nearestKey = getNearestGridKey(lat, lng);
                    if (!nearestKey || !METEOGRAM_DATA[nearestKey]) return;

                    var pointData = METEOGRAM_DATA[nearestKey];
                    var rawData = (pointData[currentVar] && pointData[currentVar][accumMode]) ? pointData[currentVar][accumMode] : null;
                    if (!rawData) return;

                    var modal = document.getElementById('meteogram-modal');
                    modal.style.display = 'block';
                    var ctx = document.getElementById('meteogramChart').getContext('2d');
                    if (chartInstance) { chartInstance.destroy(); }

                    var labelUnit = "";
                    if (currentVar === "pra") labelUnit = accumMode === "hourly" ? "mm" : "mm (24h Total)";
                    else if (currentVar === "vort") labelUnit = "10⁻⁵ s⁻¹";
                    else if (currentVar === "ps") labelUnit = "hPa";

                    document.getElementById('meteogram-title').innerText = "📊 " + currentVar.toUpperCase() + " (" + accumMode.toUpperCase() + ") @ " + lat + "°N, " + lng + "°E";

                    var isPressure = (currentVar === "ps");
                    var cleanData = rawData.map(function(val) {
                        if (val === null || val === undefined) return null;
                        if (isPressure && val <= 500.0) return null;
                        return val;
                    });

                    var labels = accumMode === "hourly"
                        ? Array.from({length: cleanData.length}, (_, i) => "+" + (i + 1) + "h")
                        : Array.from({length: cleanData.length}, (_, i) => "Day " + (i + 1));

                    chartInstance = new Chart(ctx, {
                        type: (accumMode === "24h" && currentVar === "pra") ? 'bar' : 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: labelUnit,
                                data: cleanData,
                                borderColor: '#38bdf8',
                                backgroundColor: 'rgba(56, 189, 248, 0.25)',
                                fill: true,
                                tension: 0.1,
                                pointRadius: accumMode === "hourly" ? 0 : 3
                            }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            scales: {
                                x: { ticks: { color: '#94a3b8', maxTicksLimit: 12 }, grid: { color: '#1e293b' } },
                                y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
                            },
                            plugins: { legend: { display: false } }
                        }
                    });
                }

            } catch(e) {
                console.error("Timeline init error:", e);
            }
        })();
    });
    </script>
